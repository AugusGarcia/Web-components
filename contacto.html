<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/components/nav/nav.css" />
    <link rel="stylesheet" href="./src/pages/contacto.css" />
    <link rel="stylesheet" href="./src/components/card/card.css">
    <link rel="stylesheet" href="./src/components/button/button.css">
    <link rel="stylesheet" href="./src/components/footer/footer.css">
    <script defer src="./src/components/nav/nav.js"></script>
    <script defer src="./src/components/card/card.js"></script>
    <script defer src="./src/components/footer/footer.js"></script>
    <script defer src="./src/pages/contacto.js"></script>
    <title>Contacto</title>
</head>
<body>
    <header class="navbar"></header>
    <section class="contact">
        <h1 class="contact_title">Escribime</h1>
        <form action="/" class="form">
          <div class="form__fieldset">
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombre" required>
          </div>
          <div class="form__fieldset">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Email" required>
          </div>
          <div class="form__fieldset">
            <label for="mensaje">Mensaje</label>
            <textarea name="mensaje" id="mensaje" placeholder="Escriba su mensaje " required></textarea>
          </div>
          <button type="submit" class="form__submit">Enviar <img src="./img/submit-icon.png" alt="Sumbit icon"></button>
          <p class="send-message"></p>
        </form>
      </section>
    <section class="footer"></section>
</body>
</html>
